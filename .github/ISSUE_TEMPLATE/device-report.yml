name: Device report
description: Tell us what happened when you tried a USB DAC with Contour.
title: "Device report: "
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Check the [supported devices page](https://contoureq.app/install/#dacs) first: the buttons there open this form with the device already filled in.
        A new device joins the supported list once it is confirmed on real hardware. Please do not attach anything you do not want to be public.
  - type: input
    id: device_name
    attributes:
      label: Device name
      description: The product name on the box, for example "CrinEar Protocol Max".
    validations:
      required: true
  - type: input
    id: vid_pid
    attributes:
      label: VID:PID
      description: Vendor and product ID in hex, for example 3302:C20F. The compatibility page explains how to find it.
      placeholder: "3302:C20F"
    validations:
      required: true
  - type: input
    id: usb_name
    attributes:
      label: USB product name, exactly as shown
      description: Copy it character by character. Some names end in a space or contain a double space; say so if yours does.
    validations:
      required: true
  - type: input
    id: listed_as
    attributes:
      label: How the compatibility page lists it
      description: Filled in by the page. Leave it as it is, or write "not listed" for a new device.
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - Contour 1.8.3
        - Contour 1.8.2
        - Contour 1.8.1
        - Contour 1.8.0
        - Contour 1.7.0
        - Contour 1.6.6
        - Contour 1.6.5
        - Contour 1.6.4
        - Contour 1.6.3
        - Contour 1.6.2
        - Contour 1.6.1
        - Contour 1.6.0
        - Contour 1.5.2
        - Contour 1.5.1
        - Contour 1.5.0
        - Contour 1.4.1
        - Contour 1.4.0
        - Contour 1.3.3
        - Contour 1.3.2
        - Other (say which in the notes)
    validations:
      required: true
  - type: input
    id: phone_android
    attributes:
      label: Phone and Android version
      placeholder: "Example: Pixel 8, Android 15"
    validations:
      required: true
  - type: checkboxes
    id: results
    attributes:
      label: What worked
      description: Tick everything that worked. Leave the rest empty.
      options:
        - label: Contour recognised the device
        - label: Reading the EQ worked
        - label: Importing a profile worked
        - label: Hold to send wrote the EQ and the read-back matched
        - label: Hardware volume worked
  - type: textarea
    id: problem
    attributes:
      label: What went wrong
      description: What you did, what you expected and what happened. Say which step failed. Write "nothing" if everything worked.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Contour logs every USB report it sends and receives under the tag ContourUsb. Turn on USB debugging in Developer options, try the DAC in Contour, then connect the phone to a computer and run `adb logcat -d -s ContourUsb > contour-log.txt` soon after (the log is a ring buffer). Paste the file here. Remove anything private.
      render: text
